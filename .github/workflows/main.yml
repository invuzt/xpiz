name: Build Universal xpiz
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Build Rust
        run: |
          cd rust_logic
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -1)
          export TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64
          export PATH=$TOOLCHAIN/bin:$PATH
          
          # Build 64-bit (Hanya arahkan ke path aarch64)
          RUSTFLAGS="-L $TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/24" \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang \
          cargo build --target aarch64-linux-android --release
          
          # Build 32-bit (Hanya arahkan ke path arm-linux-androideabi)
          RUSTFLAGS="-L $TOOLCHAIN/sysroot/usr/lib/arm-linux-androideabi/24" \
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=armv7a-linux-androideabi24-clang \
          cargo build --target armv7-linux-androideabi --release

      - name: Build Java & APK
        run: |
          PLATFORM_JAR=$(find $ANDROID_SDK_ROOT/platforms -name "android.jar" | sort -r | head -1)
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -1)
          
          mkdir -p obj
          javac -d obj -cp $PLATFORM_JAR src/co/xpiz/MainActivity.java
          $BUILD_TOOLS/d8 --release --lib $PLATFORM_JAR --output . obj/co/xpiz/*.class
          
          mkdir -p res/values
          echo '<resources><string name="app_name">xpiz</string></resources>' > res/values/strings.xml
          
          $BUILD_TOOLS/aapt package -f -M AndroidManifest.xml -S res -I $PLATFORM_JAR -F xpiz-raw.apk
          zip -g xpiz-raw.apk classes.dex
          
          mkdir -p lib/arm64-v8a lib/armeabi-v7a
          cp rust_logic/target/aarch64-linux-android/release/libxpiz_engine.so lib/arm64-v8a/
          cp rust_logic/target/armv7-linux-androideabi/release/libxpiz_engine.so lib/armeabi-v7a/
          zip -r xpiz-raw.apk lib/
          
          $BUILD_TOOLS/zipalign -v 4 xpiz-raw.apk xpiz-final.apk
          
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=xpiz"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --out xpiz.apk xpiz-final.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: xpiz-hybrid-v4
          path: xpiz.apk
