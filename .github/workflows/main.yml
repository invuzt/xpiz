# ... (bagian atas tetap sama sampai 'Assemble & Sign APK')

      - name: Assemble & Sign APK
        run: |
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -1)
          PLATFORM_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar
          
          # PASTIKAN minSdkVersion tertulis jelas di sini
          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.invuzt.xpiz">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <application android:hasCode="true" android:label="xpiz Mobile">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>' > AndroidManifest.xml
          
          mkdir -p empty_res
          $BUILD_TOOLS_PATH/aapt package -f -M AndroidManifest.xml -I $PLATFORM_JAR -F xpiz-temp.apk empty_res
          zip -g xpiz-temp.apk classes.dex
          mkdir -p lib/arm64-v8a
          cp libs/arm64-v8a/libhello.so lib/arm64-v8a/
          zip -g xpiz-temp.apk lib/arm64-v8a/libhello.so
          
          # Pakai keystore yang sudah ada agar tidak bentrok
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=xpiz" || true
          
          $BUILD_TOOLS_PATH/apksigner sign --ks debug.keystore --ks-pass pass:android --out xpiz.apk xpiz-temp.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpiz-Mobile-Build
          path: xpiz.apk
