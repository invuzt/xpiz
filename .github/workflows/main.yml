name: Build Particle Collider
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build
        run: |
          cd rust_logic
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -1)
          export TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64
          export PATH=$TOOLCHAIN/bin:$PATH
          RUSTFLAGS="-L $TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/26" \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android26-clang cargo build --target aarch64-linux-android --release
          cd ..
          PLATFORM_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -1)
          mkdir -p obj
          javac -d obj -cp $PLATFORM_JAR src/co/xpiz/engine/MainActivity.java
          $BUILD_TOOLS/d8 --release --lib $PLATFORM_JAR --output . obj/co/xpiz/engine/*.class
          
          # Fix: Pastikan res folder ada dan diproses
          $BUILD_TOOLS/aapt package -f -M AndroidManifest.xml -S res -I $PLATFORM_JAR -F xpiz-raw.apk
          
          zip -g xpiz-raw.apk classes.dex
          mkdir -p lib/arm64-v8a
          cp rust_logic/target/aarch64-linux-android/release/libxpiz_engine.so lib/arm64-v8a/
          zip -r xpiz-raw.apk lib/
          $BUILD_TOOLS/zipalign -v 4 xpiz-raw.apk xpiz-final.apk
          keytool -genkey -v -keystore xpiz.keystore -storepass xpiz123 -alias xpiz -keypass xpiz123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=xpiz"
          $BUILD_TOOLS/apksigner sign --ks xpiz.keystore --ks-pass pass:xpiz123 --out xpiz.apk xpiz-final.apk
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: particle-engine
          path: xpiz.apk
